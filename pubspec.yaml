name: devamitkumartiwari
description: " A personal portfolio website built with Flutter Web."
publish_to: 'none'
version: 1.0.0+1



environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.5
  url_launcher: ^6.2.5
  google_fonts: ^6.1.0
  flutter_svg: ^2.1.0
  flutter_hooks: ^0.20.5

  # Web support
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/images/
