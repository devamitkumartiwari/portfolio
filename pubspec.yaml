name: devamitkumartiwari
description: " A personal portfolio website built with Flutter Web."
publish_to: 'none'
version: 1.0.0+1



environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  shared_preferences: ^2.3.3

  # Web support
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/images/
