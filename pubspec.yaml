name: portfolio
description: Mobile Developer — Flutter & Android

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  animated_theme_switcher: ^2.0.10
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_animate: ^4.5.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  flutter_web_plugins:
    sdk: flutter
  font_awesome_flutter: ^10.8.0
  go_router: ^13.2.5
  google_fonts: ^8.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/svg/
    - assets/images/
    - assets/images/social/
    - assets/images/technology/
