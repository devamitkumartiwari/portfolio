publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.4.4 <4.0.0"

dependencies:
  animated_theme_switcher: ^2.0.10
  carousel_slider: ^5.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^9.1.2
  flutter:
    sdk: flutter
  flutter_html: null
  flutter_riverpod: ^2.6.1
  flutter_svg: ^1.1.6
